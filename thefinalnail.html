<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TFN Suggestions</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstra.386-cdn@1.0.0/css/bootstra.386.min.css">
  
  <style>
    body {
      background: #008080;
      font-family: 'Courier New', monospace;
      padding: 20px 10px;
    }

    .window {
      max-width: 640px;
      margin: 0 auto;
      border: 3px solid #dfdfdf;
      box-shadow: 4px 4px 0 #000;
      background: #c0c0c0;
    }

    .title-bar {
      background: linear-gradient(to right, #000080, #1084d0);
      color: white;
      padding: 6px 12px;
      font-weight: bold;
      text-align: center;
      font-size: 1.15rem;
      border-bottom: 2px solid #fff;
    }

    .window-body {
      padding: 20px;
      background: #c0c0c0;
    }

    .game-tabs {
      display: flex;
      gap: 3px;
      margin-bottom: 20px;
      border-bottom: 2px solid #808080;
    }

    .game-tab {
      padding: 10px 20px;
      background: #c0c0c0;
      border: 2px solid #fff;
      border-bottom: none;
      border-right-color: #808080;
      border-left-color: #fff;
      font-weight: bold;
      cursor: pointer;
      flex: 1;
      text-align: center;
      box-shadow: 2px 2px 0 #808080 inset;
    }

    .game-tab.active {
      background: #ffffff;
      border-color: #fff #808080 #fff #fff;
      box-shadow: none;
      z-index: 2;
      border-bottom: 2px solid #ffffff;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #000;
    }

    .form-control {
      border: 2px inset #fff;
      background: #fff;
      font-family: 'Courier New', monospace;
      padding: 9px;
      font-size: 15px;
    }

    textarea.form-control {
      min-height: 130px;
      resize: vertical;
    }

    .btn-send {
      background: #008000;
      color: white;
      border: 2px solid #000;
      padding: 14px;
      font-weight: bold;
      width: 100%;
      box-shadow: 3px 3px 0 #000;
      font-size: 1.05rem;
    }

    .btn-send:disabled {
      background: #666;
      cursor: not-allowed;
    }

    .recent-list {
      margin-top: 30px;
      border-top: 2px solid #808080;
      padding-top: 15px;
    }

    .recent-list h3 {
      font-size: 1rem;
      margin-bottom: 10px;
      color: #000;
    }

    .suggestion-item {
      background: #fff;
      border: 2px inset #fff;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      min-height: 28px;
    }
  </style>
</head>
<body>

  <div class="window">
    <div class="title-bar">
      TFN SUGGESTION BOX
    </div>

    <div class="window-body">

      <div class="game-tabs">
        <div class="game-tab active" data-game="remade">TFN: Remade</div>
        <div class="game-tab" data-game="plus">TFN+</div>
      </div>

      <form id="suggestionForm">
        <div class="form-group">
          <label for="username">YOUR PLAYER NAME</label>
          <input type="text" class="form-control" id="username" 
                 placeholder="e.g. PixelWarrior42" required>
        </div>

        <div class="form-group">
          <label for="suggestion">WHAT SHOULD WE ADD?</label>
          <textarea class="form-control" id="suggestion" rows="6" 
                    placeholder="Describe your idea in detail..." required></textarea>
        </div>

        <button type="submit" id="sendBtn" class="btn btn-success btn-send">SEND SUGGESTION</button>
      </form>

      <div id="status" class="status"></div>

      <div class="recent-list">
        <h3>YOUR RECENT SUGGESTIONS</h3>
        <div id="recentSuggestions"></div>
      </div>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1492527805836300471/xq_FW9vDQ6FK7HixfVq9f3ae0KuLrMDTGffXIUdgYu3uw-7opgirXLb4b3si7D_rwSec";
    const GLOBAL_COOLDOWN = 90;

    let selectedGame = "remade";

    function loadRecentSuggestions() {
      const recent = JSON.parse(localStorage.getItem('tfnSuggestions') || '[]');
      const container = document.getElementById('recentSuggestions');
      container.innerHTML = '';

      if (recent.length === 0) {
        container.innerHTML = '<div style="color:#666; font-style:italic;">No suggestions yet.</div>';
        return;
      }

      recent.forEach(s => {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.innerHTML = `
          <strong>${s.game}</strong> — ${s.username}<br>
          <small>${new Date(s.time).toLocaleString()}</small><br>
          ${s.text}
        `;
        container.appendChild(div);
      });
    }

    function saveSuggestion(username, suggestionText) {
      let recent = JSON.parse(localStorage.getItem('tfnSuggestions') || '[]');
      recent.unshift({
        game: selectedGame === 'remade' ? 'TFN: Remade' : 'TFN+',
        username: username,
        text: suggestionText.substring(0, 300),
        time: Date.now()
      });
      recent = recent.slice(0, 5);
      localStorage.setItem('tfnSuggestions', JSON.stringify(recent));
      loadRecentSuggestions();
    }

    function checkCooldown() {
      const lastSend = parseInt(localStorage.getItem('tfnLastSuggestionTime') || '0');
      const remaining = Math.ceil((lastSend + GLOBAL_COOLDOWN * 1000 - Date.now()) / 1000);

      const btn = document.getElementById('sendBtn');

      if (remaining > 0) {
        btn.disabled = true;
        btn.textContent = `GLOBAL COOLDOWN: ${remaining}s`;
        return remaining;
      } else {
        btn.disabled = false;
        btn.textContent = "SEND SUGGESTION";
        return 0;
      }
    }

    function startCooldownTimer() {
      localStorage.setItem('tfnLastSuggestionTime', Date.now());
      const interval = setInterval(() => {
        const timeLeft = checkCooldown();
        if (timeLeft <= 0) clearInterval(interval);
      }, 800);
    }

    document.querySelectorAll('.game-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.game-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        selectedGame = tab.dataset.game;
      });
    });

    document.getElementById('suggestionForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const suggestionText = document.getElementById('suggestion').value.trim();
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('sendBtn');

      if (!username || !suggestionText) {
        statusEl.innerHTML = '<span style="color:#aa0000;">Please fill all fields!</span>';
        return;
      }

      if (checkCooldown() > 0) {
        statusEl.innerHTML = '<span style="color:#aa0000;">Global cooldown active. Please wait.</span>';
        return;
      }

      statusEl.textContent = 'Sending...';
      btn.disabled = true;

      const gameName = selectedGame === 'remade' ? 'TFN: Remade' : 'TFN+';

      const payload = {
        embeds: [{
          title: `📬 New Suggestion - ${gameName}`,
          color: 0x00C853,
          description: suggestionText,
          fields: [
            { name: "Player", value: username, inline: true },
            { name: "Game", value: gameName, inline: true }
          ],
          timestamp: new Date().toISOString(),
          footer: { text: "TFN Suggestion System" }
        }]
      };

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          statusEl.innerHTML = '<span style="color:#008000;">✅ Suggestion sent successfully!</span>';
          saveSuggestion(username, suggestionText);
          startCooldownTimer();
        } else if (res.status === 429) {
          statusEl.innerHTML = '<span style="color:#aa0000;">Rate limited by Discord. Try again later.</span>';
        } else {
          throw new Error();
        }
      } catch (err) {
        statusEl.innerHTML = '<span style="color:#aa0000;">❌ Failed to send. Please try again.</span>';
        btn.disabled = false;
      }
    });

    loadRecentSuggestions();
    checkCooldown();
  </script>
</body>
</html>
