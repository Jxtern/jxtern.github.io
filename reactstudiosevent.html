<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Request</title>

  <link rel="stylesheet" href="https://unpkg.com/98.css" />

  <style>
    body {
      background: teal;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }

    .window {
      width: 520px;
      max-width: 100%;
    }

    .window-body {
      padding: 14px;
    }

    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 4px;
    }

    input,
    textarea,
    select {
      width: 100%;
      box-sizing: border-box;
    }

    textarea {
      height: 160px;
      resize: none;
    }

    .info {
      margin: 10px 0;
      padding: 8px;
      border: 1px solid #808080;
      background: #ffffe1;
      font-size: 12px;
    }

    .counter {
      text-align: right;
      font-size: 11px;
      margin-top: 3px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .status {
      font-size: 12px;
      padding: 4px 6px;
    }

    .status.ok {
      color: green;
    }

    .status.err {
      color: darkred;
    }
  </style>
</head>

<body>

  <div class="window">

    <div class="title-bar">
      <div class="title-bar-text">
        React Studios Community Relations
      </div>
    </div>

    <div class="window-body">

      <p>Submit a structured event request for review.</p>

      <div class="info">
        <strong>Important:</strong>
        Due to Discord's limitations, the Event Idea / Description
        is limited to 800 characters. Please keep your overview and
        step-by-step instructions concise.
      </div>

      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        placeholder="Discord name"
      />

      <label for="title">Event Title</label>
      <input
        type="text"
        id="title"
        placeholder="Short event name..."
      />


      <label for="serverType">Event Scale</label>
      <select id="serverType">
        <option>Massive Scale</option>
        <option>Large Scale</option>
        <option>Small Scale</option>
        <option>Community-Wide/Server-Wide</option>
        <option>Other</option>
      </select>

      <label for="dateTime">Date and Time Hosting</label>
      <input
        type="text"
        id="dateTime"
        placeholder="Use: https://r.3v.fi/discord-timestamps/"
      />


      <label for="eventType">Event Type</label>
      <input
        type="text"
        id="eventType"
        placeholder="Example: Emergency Response"
      />


      <label for="frequency">Repeating or Single Event</label>
      <select id="frequency">
        <option>Single Event</option>
        <option>Repeating Event</option>
        <option>Both</option>
      </select>


      <label for="idea">Event Idea / Description</label>

      <textarea
        id="idea"
        maxlength="800"
        placeholder="Overview

Step-by-step instructions for running the event..."
        oninput="updateCounter()"
      ></textarea>

      <div class="counter">
        <span id="counter">0</span>/800 characters
      </div>

      <div class="footer">
        <div id="status" class="status"></div>
        <button onclick="sendRequest()">Send Request</button>
      </div>

    </div>
  </div>

  <script>
    function setStatus(msg, type) {
      const el = document.getElementById("status");

      el.textContent = msg;
      el.className = "status " + (type || "");
    }

    function updateCounter() {
      const idea = document.getElementById("idea").value;
      const counter = document.getElementById("counter");

      counter.textContent = idea.length;

      if (idea.length >= 800) {
        counter.style.color = "darkred";
      } else {
        counter.style.color = "";
      }
    }

    function sendRequest() {
      const username =
        document.getElementById("username").value.trim();

      const title =
        document.getElementById("title").value.trim();

      const serverType =
        document.getElementById("serverType").value;

      const dateTime =
        document.getElementById("dateTime").value.trim();

      const eventType =
        document.getElementById("eventType").value.trim();

      const frequency =
        document.getElementById("frequency").value;

      const idea =
        document.getElementById("idea").value.trim();

      if (
        !username ||
        !title ||
        !dateTime ||
        !eventType ||
        !idea
      ) {
        setStatus(
          "Please fill all required fields.",
          "err"
        );

        return;
      }

      if (idea.length > 800) {
        setStatus(
          "Event description must be 800 characters or less.",
          "err"
        );

        return;
      }

      setStatus("Sending request...", "");

      const webhookURL =
        "https://discord.com/api/webhooks/1523309013276557433/XCrSegRkBgPgwZ8mgUrZsA-Q4FoaCjhnNy9KVOYX-p6t0dskO_z9G6fGvuevlrUBxVhQ";

      const payload = {
        content: "<@&1477134064749383702>",

        embeds: [
          {
            title: "Event Request Submission",

            description:
              "A new event request has been submitted and is awaiting review.",

            color: 3447003,

            fields: [
              {
                name: "Username",
                value: username,
                inline: true
              },

              {
                name: "Event Title",
                value: title
              },

              {
                name: "Type of Server",
                value: serverType,
                inline: true
              },

              {
                name: "Date and Time Hosting",
                value: dateTime,
                inline: true
              },

              {
                name: "Event Type [See Handbook]",
                value: eventType,
                inline: true
              },

              {
                name: "Repeating or Single Event",
                value: frequency,
                inline: true
              },

              {
                name: "Overview / Step-by-Step Instructions",
                value: idea
              }
            ],

            footer: {
              text: "React Studios Community Relations"
            },

            timestamp: new Date().toISOString()
          }
        ]
      };

      fetch(webhookURL, {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify(payload)
      })

      .then(res => {
        if (res.ok) {

          setStatus(
            "Request sent",
            "ok"
          );


          document.getElementById("username").value = "";
          document.getElementById("title").value = "";
          document.getElementById("dateTime").value = "";
          document.getElementById("eventType").value = "";
          document.getElementById("idea").value = "";

          updateCounter();

        } else {

          setStatus(
            "Failed to send",
            "err"
          );
        }
      })

      .catch(() => {

        setStatus(
          "Error sending request",
          "err"
        );
      });
    }

    updateCounter();
  </script>

</body>
</html>
