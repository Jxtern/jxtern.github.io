<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Request</title>

  <link rel="stylesheet" href="https://unpkg.com/98.css" />

  <style>
    body {
      background: teal;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }

    .window {
      width: 520px;
    }

    .window-body {
      padding: 14px;
    }

    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 4px;
    }

    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
    }

    textarea {
      height: 110px;
      resize: none;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row > div {
      flex: 1;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .status {
      font-size: 12px;
      padding: 4px 6px;
    }

    .status.ok {
      color: green;
    }

    .status.err {
      color: darkred;
    }
  </style>
</head>

<body>

<div class="window">
  <div class="title-bar">
    <div class="title-bar-text">React Studios Community Relations</div>
  </div>

  <div class="window-body">

    <p>Submit a structured event request for review.</p>

    <div class="row">
      <div>
        <label>Username</label>
        <input type="text" id="username" placeholder="Discord name" />
      </div>

      <div>
        <label>Category</label>
        <select id="category">
          <option>Massive Scale</option>
          <option>Large Scale</option>
          <option>Small Scale</option>
          <option>Community-Wide/Server-Wide</option>
          <option>Other</option>
        </select>
      </div>
    </div>

    <label>Event Title</label>
    <input type="text" id="title" placeholder="Short event name..." />

    <label>Event Idea / Description</label>
    <textarea id="idea" placeholder="Describe the event in detail..."></textarea>

    <div class="footer">
      <div id="status" class="status"></div>
      <button onclick="sendRequest()">Send Request</button>
    </div>

  </div>
</div>

<script>
function setStatus(msg, type) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status " + (type || "");
}

function sendRequest() {
  const username = document.getElementById("username").value.trim();
  const category = document.getElementById("category").value;
  const title = document.getElementById("title").value.trim();
  const idea = document.getElementById("idea").value.trim();

  if (!username || !title || !idea) {
    setStatus("Please fill all required fields.", "err");
    return;
  }

  setStatus("Sending request...", "");

  const webhookURL = "https://discord.com/api/webhooks/1523309013276557433/XCrSegRkBgPgwZ8mgUrZsA-Q4FoaCjhnNy9KVOYX-p6t0dskO_z9G6fGvuevlrUBxVhQ";

  const payload = {
    content: "<@&1477134064749383702>",

    embeds: [
      {
        title: "Event Request Submission",
        description: "A new event request has been submitted and is awaiting review.",
        color: 3447003,

        fields: [
          {
            name: "User",
            value: username,
            inline: true
          },
          {
            name: "Category",
            value: category,
            inline: true
          },
          {
            name: "Title",
            value: title
          },
          {
            name: "Idea",
            value: idea
          }
        ],

        footer: {
          text: "React Studios Community Relations"
        },

        timestamp: new Date().toISOString()
      }
    ]
  };

  fetch(webhookURL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  })
  .then(res => {
    if (res.ok) {
      setStatus("Request sent", "ok");

      document.getElementById("username").value = "";
      document.getElementById("title").value = "";
      document.getElementById("idea").value = "";
    } else {
      setStatus("failed to send", "err");
    }
  })
  .catch(() => {
    setStatus("error", "err");
  });
}
</script>

</body>
</html>
